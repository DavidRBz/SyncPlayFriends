<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncPlay - Sincronização de Vídeo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans antialiased">
    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-indigo-500 mb-2">SyncPlay</h1>
            <p class="text-gray-400">Sincronize a reprodução de vídeos locais com seus amigos</p>
        </header>

        <!-- Tela de Setup (Criar/Entrar) -->
        <div id="setup-screen" class="max-w-md mx-auto bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
            <h2 id="setup-title" class="text-2xl font-semibold mb-6 text-center">Criar Sessão</h2>
            
            <div class="space-y-4">
                <div id="name-container" class="hidden">
                    <label class="block text-sm text-gray-400 mb-1">Seu Nome</label>
                    <input type="text" id="user-name" placeholder="Ex: João" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Senha da Sala (Opcional)</label>
                    <input type="password" id="room-password" placeholder="Deixe em branco para sala pública" class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white">
                </div>
                
                <button id="action-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors mt-4">
                    Criar Sala
                </button>
            </div>
        </div>

        <!-- Tela da Sessão (Timers) -->
        <div id="session-screen" class="hidden">
            <!-- Barra Superior de Controle e Status -->
            <div class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-4 rounded-xl mb-8 border border-gray-700 gap-4">
                <div class="flex items-center space-x-3">
                    <span class="text-gray-400 text-sm">Sala:</span>
                    <span id="room-id-display" class="font-mono font-bold text-indigo-400 bg-gray-900 px-3 py-1.5 rounded-lg text-lg"></span>
                    
                    <!-- Botão de Copiar com Ícone -->
                    <button id="copy-link-btn" title="Copiar Link de Convite" class="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors flex items-center justify-center text-gray-300 hover:text-white">
                        <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        <span id="copy-toast" class="hidden text-xs bg-emerald-600 text-white absolute transform -translate-y-8 px-2 py-1 rounded">Copiado!</span>
                    </button>
                </div>

                <!-- Painel de Ações do Criador (Oculto por padrão) -->
                <div id="host-actions-panel" class="hidden flex flex-wrap gap-2 w-full md:w-auto justify-end">
                    <button onclick="resetAllTimers()" class="bg-amber-600/20 hover:bg-amber-600 border border-amber-500/40 hover:border-amber-500 text-amber-300 hover:text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">
                        Resetar Todos
                    </button>
                    <button onclick="deleteRoom()" class="bg-red-600/20 hover:bg-red-600 border border-red-500/40 hover:border-red-500 text-red-400 hover:text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">
                        Excluir Sala
                    </button>
                </div>
            </div>

            <div id="timers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Os timers serão injetados aqui via JS -->
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module" src="./app.js"></script>
</body>
</html>
